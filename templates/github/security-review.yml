# AI security review on every pull request — on your Claude Pro/Max plan, no API key.
# Anthropic's claude-code-action (MIT) signed in with a Claude Code OAuth token.
#
# Runs ONLY when the CLAUDE_CODE_OAUTH_TOKEN repository secret exists: without it the
# review job is skipped (grey), never red. Activate once per repo:
#     claude setup-token                                     # prints a long-lived token (needs a Claude subscription)
#     gh secret set CLAUDE_CODE_OAUTH_TOKEN -R <owner/repo>  # paste it when prompted
#
# Pushes straight to a branch are reviewed locally instead: sec-init installs a pre-push
# hook (`sec-review`) that runs the same review on your machine before anything leaves it.
# Fork PRs never receive secrets, so they are skipped automatically (the review reads PR
# text, so only trusted PRs should ever get the token). Edit freely — sec-init seeds this
# once and never overwrites your edits.
name: Security Review (Claude)

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions: {}

jobs:
  gate:  # `secrets` can't be read in a job-level `if:`, so a tiny job turns the secret into an output
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: if [ -n "$TOKEN" ]; then echo "enabled=true"; else echo "enabled=false"; fi >> "$GITHUB_OUTPUT"

  security:
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # post the findings as review comments
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are a senior security engineer. Review ONLY the security implications this PR
            newly adds (read the diff with `gh pr diff`), following Anthropic's /security-review
            criteria: report only HIGH-CONFIDENCE (>80%) vulnerabilities with a real attack path —
            injection (SQL, command, template, path), authentication or authorization bypass,
            secrets in code, unsafe deserialization, SSRF, XSS, broken crypto, sensitive data
            exposure. Skip style, theory, DoS and rate limiting, and pre-existing issues.

            For each finding, leave an inline comment on the exact line with: severity (HIGH or
            MEDIUM), what an attacker does, and the fix. Then post ONE summary comment with
            `gh pr comment`: the findings list, or "No high-confidence security issues found."
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
